<form (submit)="onSubmit()">
  <div class="form-row">
    <div class="input">
      <label for="initial-investment">Initial Investment</label>
      <input type="number" id="initial-investment" [(ngModel)]="initialInvestment" />
    </div>
    <div class="input">
      <label for="annual-investment">Annual Investment</label>
      <input type="number" id="annual-investment" [(ngModel)]="annualInvestment" />
    </div>
  </div>
  <div class="form-row">
    <div class="input">
      <label for="return">Expected Return</label>
      <input type="number" id="return" [(ngModel)]="expectedReturn" />
    </div>
    <div class="input">
      <label for="duration">Duration</label>
      <input type="text" id="duration" [(ngModel)]="duration" pattern="[0-9]*" />
    </div>
  </div>
  <button type="submit">Calculate</button>
</form>
