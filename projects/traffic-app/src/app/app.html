<app-header></app-header>

<main>
  <div id="dashboard">
    <app-dashboard-item
      [imgData]="{ src: 'status.png', alt: 'A signal symbol' }"
      title="Server Status"
    >
      <app-server-status [status]="currentStatus"></app-server-status>
    </app-dashboard-item>
    <app-dashboard-item [imgData]="{ src: 'globe.png', alt: 'A globe' }" [title]="'Traffic'">
      <app-traffic [trafficData]="dummyTrafficData" [max]="maxTraffic"></app-traffic>
    </app-dashboard-item>
    <app-dashboard-item
      [imgData]="{ src: 'list.png', alt: 'A list of items' }"
      [title]="'Support Tickets'"
    >
      <app-tickets></app-tickets>
    </app-dashboard-item>
  </div>
</main>
