<app-header></app-header>
<main class="!py-[20px] flex gap-4 !m-auto w-[80%]">
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user
          [selected]="user.id === selectedUser?.id"
          [user]="user"
          (selectUser)="onSelectUser($event)"
        />
      </li>
    }
  </ul>
  <div class="w-full !p-[20px] text-center">
    @if (selectedUser) {
      <app-user-tasks [user]="selectedUser"></app-user-tasks>
    } @else {
      <p class="text-white text-2xl text-center">Select a User to see their tasks!</p>
    }
  </div>
</main>
