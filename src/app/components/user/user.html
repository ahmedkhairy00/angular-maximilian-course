<div>
  <button
    [class.active]="selected"
    (click)="onSelectUser()"
    class="flex items-center gap-4 bg-purple-600 p-4 rounded-lg !px-6 py-4 !my-2 w-75 hover:bg-purple-900 cursor-pointer"
  >
    <img
      class="w-12 h-12 rounded-full"
      [src]="imagePath"
      [alt]="user.name"
      [aria-label]="user.name"
    />
    <span class="text-white text-2xl">{{ user.name }}</span>
  </button>
</div>
